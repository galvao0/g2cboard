<mat-sidenav-container class="container">
  <mat-sidenav #sidenav opened mode="side" class="sidebar">
    <div class="header-menu">
      <div class="logo">
        <img class="logo-img" src="logo.png" />
        <span class="logo-nome">G2cBoard</span>
      </div>
      <button class="btn-refresh">
        <svg lucideRefreshCcw></svg>
      </button>
    </div>

    <mat-divider></mat-divider>

    <nav class="menu">
      <span class="titulo-nav">MENU PRINCIPAL</span>

      <a
        routerLink="/"
        class="op-item"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <svg lucideLayoutDashboard [size]="22"></svg>
        <span>Dashboard</span>
      </a>

      <a routerLink="/listadevedores" class="op-item" routerLinkActive="active">
        <svg lucideUsers></svg>
        <span>Lista devedores</span>
      </a>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content class="conteudo">
    <header class="header">
      <div class="header-p1">
        <button
          mat-icon-button
          class="btn-menu"
          (click)="sidenav.toggle()"
          aria-label="Abrir ou fechar menu"
        >
          <mat-icon>menu</mat-icon>
        </button>

        <span class="titulo">{{ getTitulo() }}</span>
      </div>
      <div class="input-search">
        <input />
        <mat-icon>search</mat-icon>
      </div>
    </header>

    <main class="pagina">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
