<mat-sidenav-container class="container">
  <mat-sidenav #sidenav opened mode="side" class="sidebar">
    <div class="logo">
      <div class="logo">
        <mat-icon class="logo-icon">multiline_chart</mat-icon>
        <span class="logo-nome">G2cBoard</span>
      </div>
    </div>
    <mat-divider></mat-divider>
    <nav class="menu">
      <span class="titulo-nav">NAVEGAÇÃO</span>
      <div class="op-nav">
        <div [class.active]="router.url === '/'" class="op-item">
          <mat-icon class="icon-item">insert_chart_outline</mat-icon>
          <a routerLink="/">Dashboard</a>
        </div>
      <div class="op-item" [class.active]="router.url === '/listadevedores'">
        <mat-icon class="icon-item">person</mat-icon>
        <a routerLink="/listadevedores">Lista devedores</a>
      </div>
      <div class="op-item">
        <mat-icon class="icon-item">show_chart</mat-icon>
        <a routerLink="/" class="">Gráficos</a>
      </div>
      <div class="op-item">
        <mat-icon class="icon-item">settings</mat-icon>
        <a routerLink="/">Configurações</a>
      </div>
      </div>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content>
    <main>
      <header class="header">
        <button class="btn-menu" (click)="sidenav.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
        <span class="titulo">{{ getTitulo() }}</span>
      </header>
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
